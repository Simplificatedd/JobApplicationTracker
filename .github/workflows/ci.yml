name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run check

      # Catches date bugs that UTC hides: the furthest-ahead and a behind-UTC zone.
      - name: Test in other time zones
        run: TZ=Pacific/Kiritimati npx vitest run && TZ=Pacific/Honolulu npx vitest run

      - name: Test offline backup recovery
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
