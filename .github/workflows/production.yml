name: Production deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full current main SHA to deploy (must match the selected main ref)
        required: true
  # Deploy each push to main once CI has passed on it.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Manual dispatch from main, or a successful CI run for a push to main in
    # this repository. The preflight checks the same conditions again.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    # Job-level, so runs whose condition is false never enter the group and
    # cannot replace a pending deployment.
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    timeout-minutes: 15
    # Reuse the existing environment and secrets; its name is historical.
    environment: production-admission
    env:
      # A CI-triggered run deploys the commit CI tested, not the newest main.
      RELEASE_SHA: ${{ inputs.release_sha || github.event.workflow_run.head_sha }}
      CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      CI_EVENT: ${{ github.event.workflow_run.event }}
      CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CI_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ADMISSION_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PRODUCTION_APP_DATABASE_ID: ${{ vars.PRODUCTION_APP_DATABASE_ID }}
      PRODUCTION_R2_BUCKET: ${{ vars.PRODUCTION_R2_BUCKET }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          # Full history lets the preflight compare against the deployed commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check selected source and existing resource bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMISSION_PAGES_API_TOKEN }}
        run: node scripts/production-preflight.mjs
      - run: npm run check
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Recheck immediately before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMISSION_PAGES_API_TOKEN }}
        run: node scripts/production-preflight.mjs
      - name: Deploy application code to the existing project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMISSION_PAGES_API_TOKEN }}
        run: >-
          ./node_modules/.bin/wrangler pages deploy dist
          --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main
          --commit-hash="$RELEASE_SHA" --commit-dirty=false
