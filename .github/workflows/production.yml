name: Approved production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full current main SHA approved for this closed deployment
        required: true
      expected_deployment:
        description: Current canonical Pages deployment UUID
        required: true
      control_revision:
        description: Expected closed control revision (0 only for fresh installation)
        required: true
      release_mode:
        description: Initial installation is unverified; subsequent releases require drain
        type: choice
        options: [initial-closed, drained]
        required: true
      confirmation:
        description: DEPLOY-CLOSED followed by a colon and the full approved SHA
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  release:
    name: Closed deployment ${{ github.sha }} (attempt ${{ github.run_attempt }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-admission
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
      CONTROL_REVISION: ${{ inputs.control_revision }}
      RELEASE_MODE: ${{ inputs.release_mode }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ADMISSION_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PRODUCTION_PROJECT_ID: ${{ vars.PRODUCTION_PROJECT_ID }}
      PRODUCTION_APP_DATABASE_ID: ${{ vars.PRODUCTION_APP_DATABASE_ID }}
      PRODUCTION_CONTROL_DATABASE_ID: ${{ vars.PRODUCTION_CONTROL_DATABASE_ID }}
      PRODUCTION_R2_BUCKET: ${{ vars.PRODUCTION_R2_BUCKET }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify approval, actual resources and closed control state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMISSION_PAGES_API_TOKEN }}
        run: node --experimental-strip-types scripts/production-preflight.mjs before
      - run: npm run check
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run test:admission-local
      - name: Prepare fresh immutable release identity
        id: release
        run: node scripts/prepare-pages-release.mjs
      - name: Recheck immediately before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMISSION_PAGES_API_TOKEN }}
        run: node --experimental-strip-types scripts/production-preflight.mjs ready
      - name: Deploy the approved closed release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMISSION_PAGES_API_TOKEN }}
          RELEASE_LABEL: ${{ steps.release.outputs.label }}
          WRANGLER_LOG_PATH: .wrangler/production-upload.log
        run: >-
          ./node_modules/.bin/wrangler pages deploy dist
          --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main
          --commit-hash="$GITHUB_SHA" --commit-dirty=false
          --commit-message="Admission release $RELEASE_LABEL"
      - name: Verify actual promotion and unchanged control revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMISSION_PAGES_API_TOKEN }}
        run: node --experimental-strip-types scripts/production-preflight.mjs after
      - name: Preserve release identity even when upload is ambiguous
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .wrangler/production-release.json
          include-hidden-files: true
          if-no-files-found: ignore
